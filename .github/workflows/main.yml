name: LG V60 kernel build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev \
          libncurses5-dev zip python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Fetch Toolchain
        run: |
          git clone https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b clang
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32
          
      - name: Detect Kernel Version
        id: info
        run: |
          V=$(grep "^VERSION =" Makefile | awk '{print $3}')
          P=$(grep "^PATCHLEVEL =" Makefile | awk '{print $3}')
          S=$(grep "^SUBLEVEL =" Makefile | awk '{print $3}')
          echo "KVER=$V.$P.$S" >> $GITHUB_OUTPUT

      - name: Build Kernel
        env:
          PATH: ${{ github.workspace }}/clang/bin:${{ github.workspace }}/gcc64/bin:${{ github.workspace }}/gcc32/bin:/usr/bin:/bin
        run: |
          # 1. Configuration
          DEFCONFIG="defconfig"
          CUSTOM_NAME="-kiyomitest" 
          
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          
          # 2. Initialize Config (Using Clang)
          make O=out CC=clang ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE $DEFCONFIG
          
          # 3. Compile Kernel and DTBs
          make -j$(nproc --all) O=out \
               ARCH=arm64 \
               CC=clang \
               CROSS_COMPILE=$CROSS_COMPILE \
               CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               LLVM_IAS=1 \
               LOCALVERSION=$CUSTOM_NAME \
               Image.gz dtbs

          # 4. Create Image.gz-dtb
          cat out/arch/arm64/boot/Image.gz $(find out/arch/arm64/boot/dts/vendor -name "*.dtb") > out/arch/arm64/boot/Image.gz-dtb

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-v${{ steps.info.outputs.KVER }}-Custom
          path: out/arch/arm64/boot/Image.gz-dtb
